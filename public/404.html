<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // Redirect any 404 back to the app root so HashRouter can handle the route
      sessionStorage.setItem('redirect', location.href);
      location.replace('/cool-website/');
    </script>
  </head>

</html>
